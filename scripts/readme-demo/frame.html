<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AdLint README demo frame</title>
<!-- Same Fontshare request as app/layout.tsx. Geist Mono is not loaded by the
     app either; the mono stack falls back the same way app/globals.css does. -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&f[]=instrument-sans@400,500,600&display=swap">
<style>
  :root {
    /* Stage: DESIGN.md --accent #1E3A8A taken down to a deep navy (same hue). */
    --stage: #0F1D45;
    --stage-line: #24366B;
    --on-stage: #FAFAF7;
    --on-stage-muted: #C9D1E6;
    /* Accent tint for numbers on the dark stage (hue of --accent, lightened). */
    --pick: #9DB8FF;
    /* DESIGN.md tokens for the paper cards. */
    --bg: #FAFAF7;
    --surface-2: #F5F4EE;
    --ink: #1C1917;
    --muted: #57534E;
    --border: #E7E5E0;
    --accent: #1E3A8A;
    --critical: #B91C1C;
    --pass: #166534;
    --mono: "Geist Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 880px; height: 640px; background: var(--stage); overflow: hidden; }
  body { font-family: "Instrument Sans", Arial, Helvetica, sans-serif; color: var(--on-stage); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 880px; height: 640px; padding: 22px 20px 20px; }

  .top { display: flex; align-items: baseline; gap: 14px; height: 52px; }
  .step { font-family: var(--mono); font-feature-settings: "tnum"; font-size: 14px; font-weight: 600; color: var(--pick); white-space: nowrap; letter-spacing: 0.04em; }
  .headline { font-family: "General Sans", "Instrument Sans", Arial, sans-serif; font-size: 19px; font-weight: 600; line-height: 1.3; color: var(--on-stage); }
  .headline code { font-family: var(--mono); font-size: 0.92em; color: var(--pick); font-weight: 500; }

  .cols { display: flex; gap: 20px; height: 546px; }
  .left { width: 420px; display: flex; flex-direction: column; gap: 14px; }
  .right { width: 400px; }

  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; color: var(--ink); }
  .card-head { background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 7px 12px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-head b { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
  .shot { display: block; width: 100%; }
  .clip { overflow: hidden; }
  .right .card { height: 546px; }

  pre.csv { font-family: var(--mono); font-feature-settings: "tnum"; font-size: 13.5px; line-height: 1.8; padding: 10px 0; color: var(--ink); }
  pre.csv span.l { display: block; padding: 0 12px; white-space: pre; }
  pre.csv span.n { display: inline-block; width: 18px; color: var(--muted); opacity: 0.7; }
  pre.csv span.hdr { color: var(--muted); }
  pre.csv span.bad { background: rgba(185, 28, 28, 0.10); box-shadow: inset 3px 0 0 var(--critical); }
  pre.csv span.good { background: rgba(22, 101, 52, 0.10); box-shadow: inset 3px 0 0 var(--pass); }
  pre.csv em { font-style: normal; font-weight: 700; }
  pre.csv span.bad em { color: var(--critical); }
  pre.csv span.good em { color: var(--pass); }
  .card-foot { border-top: 1px solid var(--border); padding: 7px 12px; font-size: 12px; color: var(--muted); line-height: 1.45; }

  .cleared ul { list-style: none; padding: 6px 12px 8px; }
  .cleared li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; line-height: 1.35; padding: 4px 0; color: var(--ink); font-weight: 500; }
  .chip { flex: none; border-radius: 9999px; padding: 1px 8px; font-size: 11px; font-weight: 500; background: rgba(22, 101, 52, 0.10); color: var(--pass); }
  .note { font-size: 15px; line-height: 1.55; color: var(--on-stage-muted); }
  .note b { color: var(--pick); font-weight: 600; font-family: var(--mono); font-feature-settings: "tnum"; font-size: 0.95em; }
  .note strong { color: var(--on-stage); font-weight: 600; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
</body>
</html>
